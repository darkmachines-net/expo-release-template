# Prepare development candidates before manual beta approval, then serialize the existing release delivery paths.
name: Release Expo application
on:
  workflow_call:
    inputs:
      profile: { type: string, required: true }
      rebuild: { type: boolean, default: false }
    secrets:
      EXPO_TOKEN: { required: false }
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_STORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }
      DEPLOY_WG_ENDPOINT: { required: false }
      DEPLOY_WG_PRIVATE_KEY: { required: false }
      DEPLOY_TOKEN: { required: false }
permissions: { contents: read }
jobs:
  context:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: read }
    outputs:
      continuous: ${{ steps.context.outputs.continuous }}
      platforms: ${{ steps.context.outputs.platforms }}
      channel: ${{ steps.context.outputs.channel }}
      approval: ${{ steps.context.outputs.approval }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: darkmachines-net/expo-release-template, ref: '${{ job.workflow_sha }}', path: .toolkit, persist-credentials: false }
      - uses: ./.toolkit/.github/actions/setup
      - id: context
        run: node .toolkit/bin/continuous.mjs
        env: { RELEASE_PROFILE: '${{ inputs.profile }}', GITHUB_TOKEN: '${{ github.token }}' }
  development:
    needs: context
    if: needs.context.outputs.continuous == 'true'
    permissions: { contents: read, deployments: write }
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: { platform: '${{ fromJSON(needs.context.outputs.platforms) }}' }
    uses: ./.github/workflows/development.yml
    with: { operation: auto, platform: '${{ matrix.platform }}', source: '${{ github.sha }}', channel: '${{ needs.context.outputs.channel }}' }
    secrets: inherit
  approve-beta:
    name: Approve tested development candidate for beta
    needs: [context, development]
    if: needs.context.outputs.continuous == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.context.outputs.approval }}
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record approved candidate
        env: { SOURCE: '${{ github.sha }}' }
        run: echo "Approved development candidate $SOURCE for beta delivery." >> "$GITHUB_STEP_SUMMARY"
  delivery:
    needs: [context, development, approve-beta]
    if: >-
      !cancelled() && needs.context.result == 'success' &&
      ((needs.context.outputs.continuous == 'true' && needs.development.result == 'success' && needs.approve-beta.result == 'success') ||
      (needs.context.outputs.continuous != 'true' && needs.development.result == 'skipped' && needs.approve-beta.result == 'skipped'))
    permissions: { contents: write, deployments: write, packages: write, id-token: write }
    uses: ./.github/workflows/delivery.yml
    with: { profile: '${{ inputs.profile }}', rebuild: '${{ inputs.rebuild }}' }
    secrets: inherit
